# Continuous integration on GitHub: the fast gates that need no Xcode. The app
# itself is built, tested, archived and sent to TestFlight by Xcode Cloud,
# whose workflows (pull requests, main, v* tags) live in App Store Connect and
# whose hooks are in ci_scripts/.
#
# ci: thin caller for the org's reusable ci workflow. It discovers the canonical
# tasks this repo defines (`mise tasks ls --name-only`) and runs each as its own
# job on ubuntu-latest:
#   lint  — swift format lint --strict (LibreKit, GlyphCore + App), addlicense,
#           prose, shellcheck over scripts/ and ci_scripts/, actionlint + zizmor
#   build — swift build -c release of the Swift package
#   test  — swift test with coverage (scripts/test.sh), emitting
#           coverage/cobertura-coverage.xml and coverage/junit.xml for Codecov
# The package is Foundation-only, so all three run on Linux.
#
# xcodeproj: Glyph.xcodeproj is generated from project.yml by XcodeGen and
# committed; this checks the two still match. XcodeGen is a macOS binary but
# needs no particular Xcode.
#
# The reusable workflow and actions are pinned to full commit SHAs (tag in the
# comment) so a moved tag can never change what runs; Renovate keeps the pins
# fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]

# the jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@35d8e9a1ce772f67f97e73484dc5b7a50c29e0f3 # v8.1.1

  xcodeproj:
    name: xcodeproj
    runs-on: macos-latest
    permissions:
      # check out the repository
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only checkout; don't leave the token in .git/config
          submodules: true # the shared toolchain, mounted at .mise/

      # Only XcodeGen is installed: the Swift pin is for the Linux jobs.
      - name: Setup mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: v2026.11.6
          # sha256 of the macos-arm64 mise binary for the version above, from the
          # release's SHASUMS256.txt
          sha256: 8b9b3459f331bde1e7b830d829dddd7cda5a558063103e451fba9f976e91acdb
          install_args: aqua:yonaskolb/XcodeGen

      - name: Check Glyph.xcodeproj matches project.yml
        run: |
          mise run gen
          git diff --exit-code -- Glyph.xcodeproj
